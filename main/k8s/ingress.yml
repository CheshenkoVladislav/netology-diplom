apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: default
  annotations:
    gwin.yandex.cloud/subnets: "e2l7ckqrj0nc31pf80fd,fl8ao58hvklvhippqagk,e9b227lhvuvsvtnpjm10"  
    # `groupName` is required.
    gwin.yandex.cloud/groupName: "my-ingress-group" # group multiple ingresses to single Balancer
    gwin.yandex.cloud/externalIPv4Address: "auto" # external IPv4 address
    # Healthcheck
    gwin.yandex.cloud/rules.backends.hc.timeout: "5s"
    gwin.yandex.cloud/rules.backends.hc.interval: "15s"
    gwin.yandex.cloud/rules.backends.hc.healthyThreshold: "1"
    gwin.yandex.cloud/rules.backends.hc.unhealthyThreshold: "3"
    gwin.yandex.cloud/rules.backends.hc.port: "30001" # стандартный порт nginx
    gwin.yandex.cloud/rules.backends.hc.http.path: "/" # корневой путь
spec:
  ingressClassName: gwin-default # use Gwin ingress class
  rules:
    - http:
        paths:
          - path: "/myapp"
            pathType: Prefix
            backend:
              service:
                name: my-app-service
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlantis-ingress
  namespace: default
  annotations:
    # `groupName` is required.
    gwin.yandex.cloud/groupName: "my-ingress-group" # group multiple ingresses to single Balancer
    gwin.yandex.cloud/externalIPv4Address: "auto" # external IPv4 address
    # Healthcheck
    gwin.yandex.cloud/rules.backends.hc.timeout: "5s"
    gwin.yandex.cloud/rules.backends.hc.interval: "15s"
    gwin.yandex.cloud/rules.backends.hc.healthyThreshold: "1"
    gwin.yandex.cloud/rules.backends.hc.unhealthyThreshold: "3"
    # gwin.yandex.cloud/rules.prefixRewrite: "/" # rewrite path to /
    gwin.yandex.cloud/rules.backends.hc.port: "30003" # стандартный порт nginx
    gwin.yandex.cloud/rules.backends.hc.http.path: "/healthz" # корневой путь
spec:
  ingressClassName: gwin-default # use Gwin ingress class
  rules:
    - http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: atlantis-service
                port:
                  number: 4141